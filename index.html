<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" aria-label="Tic-Tac-Toe">
    <header>
      <div>
        <h1>Tic-Tac-Toe</h1>
        <div class="sub" id="statusText">Player <strong>X</strong> goes first</div>
      </div>

      <div class="topRight">
        <div class="pill" aria-live="polite">
          <span class="dot x" id="turnDot"></span>
          <span id="turnLabel">Turn: X</span>
        </div>

        <button
          class="iconBtn"
          id="settingsBtn"
          type="button"
          aria-label="Open settings"
          aria-haspopup="dialog"
          aria-expanded="false"
          title="Settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm9-3.5a7.9 7.9 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a8.5 8.5 0 0 0-1.7-1l-.4-2.6H9.6l-.4 2.6a8.5 8.5 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8.5 8.5 0 0 0 1.7 1l.4 2.6h4.8l.4-2.6a8.5 8.5 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5c.1-.3.1-.6.1-1Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="controls">
      <button id="restartBtn" title="Restart the game (no refresh)">Restart</button>
      <button class="ghost" id="clearScoresBtn" title="Clear win counters">Clear score</button>
    </div>

    <div class="boardWrap" id="boardWrap">
      <div class="board" id="board" role="grid" aria-label="3 by 3 board"></div>
      <div class="winLine" id="winLine"></div>
    </div>

    <footer>
      <span id="scoreText">X: 0 • O: 0 • Ties: 0</span>
    </footer>

    <!-- Result modal -->
    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="confetti" id="confetti"></div>
        <h2 id="resultTitle">Winner!</h2>
        <p id="resultMsg">Nice work.</p>
        <div class="modalActions">
          <button id="playAgainBtn">Play again</button>
          <button class="ghost" id="closeModalBtn">Close</button>
        </div>
      </div>
    </div>

    <!-- Settings overlay/menu -->
    <div class="sheetOverlay" id="sheetOverlay" aria-hidden="true">
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="sheetHeader">
          <div>
            <div class="sheetTitle" id="settingsTitle">Settings</div>
            <div class="sheetSubtitle">Changes apply instantly</div>
          </div>
          <button class="iconBtn" id="closeSettingsBtn" type="button" aria-label="Close settings" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.3 5.7a1 1 0 0 1 0 1.4L13.4 12l4.9 4.9a1 1 0 1 1-1.4 1.4L12 13.4l-4.9 4.9a1 1 0 0 1-1.4-1.4l4.9-4.9-4.9-4.9a1 1 0 0 1 1.4-1.4l4.9 4.9 4.9-4.9a1 1 0 0 1 1.4 0Z"></path>
            </svg>
          </button>
        </div>

        <div class="sheetBody">
          <div class="settingRow">
            <label class="settingLabel" for="themeSelect">
              Theme
              <span class="hint">Switch between dark and light</span>
            </label>
            <select id="themeSelect" class="select">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>

          <div class="settingRow">
            <label class="settingLabel" for="markStyleSelect">
              Mark style
              <span class="hint">Solid, outline, or neon</span>
            </label>
            <select id="markStyleSelect" class="select">
              <option value="solid">Solid</option>
              <option value="outline">Outline</option>
              <option value="neon">Neon</option>
            </select>
          </div>

          <div class="settingRow">
            <label class="settingLabel" for="firstPlayerSelect">
              First player
              <span class="hint">Who starts after restart</span>
            </label>
            <select id="firstPlayerSelect" class="select">
              <option value="X">X</option>
              <option value="O">O</option>
            </select>
          </div>

          <div class="settingRow">
            <label class="settingLabel" for="lineThickness">
              Win line thickness
              <span class="hint">Make the win line bolder or slimmer</span>
            </label>
            <div class="rangeWrap">
              <input id="lineThickness" type="range" min="3" max="10" step="1" />
              <span class="rangeValue" id="lineThicknessValue">6</span>
            </div>
          </div>

          <div class="settingRow">
            <label class="settingLabel" for="soundsToggle">
              Sounds
              <span class="hint">Subtle click + result tones</span>
            </label>
            <label class="switch">
              <input id="soundsToggle" type="checkbox" />
              <span class="slider" aria-hidden="true"></span>
            </label>
          </div>

          <div class="settingRow">
            <label class="settingLabel" for="reduceMotionToggle">
              Reduce motion
              <span class="hint">Turns off most animations</span>
            </label>
            <label class="switch">
              <input id="reduceMotionToggle" type="checkbox" />
              <span class="slider" aria-hidden="true"></span>
            </label>
          </div>

          <div class="sheetActions">
            <button class="ghost" id="resetSettingsBtn" type="button">Reset settings</button>
          </div>

          <div class="tinyNote">
            Tip: Press <kbd>Esc</kbd> to close this menu.
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="./script.js"></script>
</body>
</html>
